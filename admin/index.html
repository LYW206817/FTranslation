<!doctype html>
<html lang="zh-CN">
<head>
  <!-- 纯静态页，无构建；Caddy 的 CSP 只允许同源脚本、样式与请求。 -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title>FastTranslation 运营控制台</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-brand">
        <span class="logo">FT</span>
        <div>
          <div class="brand">FastTranslation</div>
          <div class="muted">运营控制台</div>
        </div>
      </div>
      <h1>登录后台</h1>
      <p class="muted">粘贴管理令牌进入。令牌只保存在本标签页的 sessionStorage，关闭标签即清除。</p>
      <label for="token-input">X-Admin-Token</label>
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit" class="primary">进入控制台</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo">FT</span>
        <div class="sidebar-brand-text">
          <strong>FastTranslation</strong>
          <span>运营控制台</span>
        </div>
      </div>

      <nav class="nav" aria-label="后台导航">
        <button type="button" class="nav-item" data-view="orders">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6M9 9h6M9 13h4M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/></svg>
          <span>订单处理</span>
          <span id="orders-badge" class="nav-badge hidden">0</span>
        </button>
        <button type="button" class="nav-item" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>
          <span>概览</span>
        </button>
        <button type="button" class="nav-item" data-view="accounts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 19v-1.5A3.5 3.5 0 0 0 12.5 14h-5A3.5 3.5 0 0 0 4 17.5V19M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11a3 3 0 0 0 0-6M20 19v-1.5a3.5 3.5 0 0 0-2.6-3.4"/></svg>
          <span>账号</span>
        </button>
        <button type="button" class="nav-item" data-view="codes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7ZM12 6v2M12 11v2M12 16v2"/></svg>
          <span>激活码</span>
        </button>
        <button type="button" class="nav-item" data-view="gateway">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>
          <span>网关健康</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="connection"><span class="dot"></span> 已连接</div>
        <div id="token-state" class="muted">令牌仅保存在本标签页</div>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">订单处理</h1>
        <p id="view-subtitle">核对到账后直接开通</p>
      </div>
      <div class="topbar-actions">
        <button id="refresh" type="button" class="ghost">刷新</button>
        <button id="logout" type="button" class="ghost">退出</button>
      </div>
    </header>

    <main class="workspace">
      <section class="view" data-view="orders">
        <div class="view-toolbar">
          <div class="segmented" id="order-tabs" role="group" aria-label="订单状态">
            <button type="button" data-status="pending_review" class="active">待审核</button>
            <button type="button" data-status="pending_payment">待支付</button>
            <button type="button" data-status="fulfilled">已开通</button>
            <button type="button" data-status="cancelled">已取消</button>
            <button type="button" data-status="all">全部</button>
          </div>
          <button id="order-refresh" type="button" class="ghost">刷新</button>
        </div>

        <div class="panel panel-orders">
          <div id="orders" class="table-wrap table-wrap-orders"></div>
          <div class="pager">
            <button id="orders-prev" type="button" class="ghost">上一页</button>
            <span id="orders-page" class="muted"></span>
            <button id="orders-next" type="button" class="ghost">下一页</button>
          </div>
        </div>
      </section>

      <section class="view hidden" data-view="overview">
        <div class="section-head">
          <h2>账号概览</h2>
          <span id="overview-updated" class="muted"></span>
        </div>
        <div id="cards" class="cards"></div>

        <div class="grid-2">
          <div class="panel">
            <div class="section-head">
              <h2>用量</h2>
              <div class="segmented" role="group" aria-label="用量窗口">
                <button type="button" data-days="7" class="active">7 天</button>
                <button type="button" data-days="30">30 天</button>
              </div>
            </div>
            <div id="usage-summary" class="summary"></div>
            <div id="usage-chart" class="chart"></div>
          </div>
          <div class="panel">
            <div class="section-head"><h2>来源</h2></div>
            <div id="usage-sources" class="table-wrap"></div>
          </div>
        </div>
      </section>

      <section class="view hidden" data-view="accounts">
        <div class="view-toolbar">
          <form id="account-search" class="inline-form">
            <input id="account-query" type="search" placeholder="搜索邮箱前缀" autocomplete="off">
            <select id="account-plan" aria-label="套餐筛选">
              <option value="">全部套餐</option>
              <option value="free">免费</option>
              <option value="light">Lite</option>
              <option value="standard">Pro</option>
              <option value="max">Max</option>
            </select>
            <button type="submit">搜索</button>
          </form>
        </div>

        <div class="panel">
          <div id="accounts" class="table-wrap"></div>
          <div class="pager">
            <button id="accounts-prev" type="button" class="ghost">上一页</button>
            <span id="accounts-page" class="muted"></span>
            <button id="accounts-next" type="button" class="ghost">下一页</button>
          </div>
        </div>
      </section>

      <section class="view hidden" data-view="codes">
        <div class="panel">
          <div class="section-head">
            <h2>生成激活码</h2>
            <form id="code-form" class="inline-form">
              <select id="code-plan" aria-label="套餐">
                <option value="light">Lite</option>
                <option value="standard">Pro</option>
                <option value="max">Max</option>
              </select>
              <input id="code-days" type="number" value="30" min="1" max="3650" aria-label="天数" required>
              <input id="code-count" type="number" value="1" min="1" max="200" aria-label="数量" required>
              <input id="code-note" type="text" placeholder="备注（可选）" autocomplete="off">
              <button type="submit" class="primary">生成</button>
            </form>
          </div>

          <div id="code-result" class="code-result hidden"></div>

          <div class="view-toolbar">
            <div class="inline-form">
              <select id="code-status" aria-label="激活码状态">
                <option value="open">未兑换</option>
                <option value="used">已兑换</option>
                <option value="revoked">已作废</option>
                <option value="all">全部</option>
              </select>
              <button id="code-refresh" type="button" class="ghost">刷新</button>
            </div>
          </div>

          <div id="codes" class="table-wrap"></div>
          <div class="pager">
            <button id="codes-prev" type="button" class="ghost">上一页</button>
            <span id="codes-page" class="muted"></span>
            <button id="codes-next" type="button" class="ghost">下一页</button>
          </div>
        </div>
      </section>

      <section class="view hidden" data-view="gateway">
        <div class="section-head">
          <h2>网关健康</h2>
          <span id="diag-updated" class="muted"></span>
        </div>
        <div id="diagnostics" class="cards"></div>
      </section>
    </main>
  </div>

  <div id="dialog" class="dialog-backdrop hidden">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" type="button" class="icon-button" aria-label="关闭">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <noscript><div class="login"><div class="login-card">运营后台需要启用 JavaScript。</div></div></noscript>
  <script src="./admin.js"></script>
</body>
</html>
